name: Isolated Ubuntu native runtime
description: Install and verify Xvfb, Mesa and OpenAL without consulting third-party APT repositories.
inputs:
  report-directory:
    description: Directory for package provenance and the real Xvfb/OpenGL probe
    default: build/ci
runs:
  using: composite
  steps:
    - name: Install signed Ubuntu packages and verify software rendering
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: |
        mkdir -p "$REPORT_DIRECTORY/apt"
        sudo -n python3 "$GITHUB_ACTION_PATH/../../../tools/ci/install_packages.py" native --report "$REPORT_DIRECTORY/apt"
        xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | tee "$REPORT_DIRECTORY/graphics.txt"
