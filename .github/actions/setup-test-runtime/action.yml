name: Java and native test runtime
description: Pinned Java/Python/Gradle setup; optionally install software graphics and audio.
inputs:
  native:
    description: Install the Linux native client dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        validate-wrappers: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - if: inputs.native == 'true'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1 libasound2t64
        mkdir -p build/ci
        xvfb-run -a glxinfo -B | tee build/ci/graphics.txt
