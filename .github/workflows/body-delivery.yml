name: Body style authoring and native verification
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['tools/body_styles/**', '.github/workflows/body-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: five-body-authoring
  cancel-in-progress: false
jobs:
  author-and-verify:
    if: github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref == 'refs/heads/feat/five-body-styles'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/five-body-styles
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply checked source integration once
        run: |
          if test -f tools/body_styles/apply_integration.py; then
            python3 tools/body_styles/apply_integration.py
            git rm tools/body_styles/apply_integration.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/body_styles/build_models.py')
          text=p.read_text()
          old="ob['apa_color']=int(color)"
          if old in text:
              assert text.count(old)==1
              text=text.replace(old,"ob['apa_color']=f'{color:08x}';ob.hide_render=variant>1")
          old="ob['apa_reference_only']=reference"
          if old in text and "ob.hide_render=c['variant']>1" not in text:
              assert text.count(old)==1
              text=text.replace(old,old+";ob.hide_render=c['variant']>1")
          p.write_text(text)
          PY
          python3 -m pip install Pillow==11.3.0
          python3 tools/body_styles/generate_resources.py
      - name: Install verified Blender and native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libopenal1 libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6
          curl --fail --location --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          curl --fail --location --retry 3 -o /tmp/blender.sha256 https://download.blender.org/release/Blender4.2/blender-4.2.3.sha256
          expected=$(grep 'blender-4.2.3-linux-x64.tar.xz' /tmp/blender.sha256 | awk '{print $1}')
          test ${#expected} -eq 64
          echo "$expected  /tmp/blender.tar.xz" | sha256sum --check
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Author editable Blender bodies, runtime meshes and review renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          /tmp/blender-4.2.3-linux-x64/blender --background --threads 4 --python-exit-code 1 --python tools/body_styles/build_models.py 2>&1 | tee body-authoring.log
          test -f assets/body_styles/profiles.json
          find assets/body_styles -name '*.blend1' -delete
      - name: Commit authored source and generated assets to the feature branch only
        run: |
          git add src sim gradle.properties assets/body_styles docs/body-styles
          git add -u tools/body_styles
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate five body styles with editable Blender models and preserving body conversions'
            git pull --rebase origin feat/five-body-styles
            git push origin HEAD:feat/five-body-styles
          fi
          git rev-parse HEAD > body-tested-commit.txt
      - name: Build and simulation tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwithGameTests build :sim:test 2>&1 | tee body-build.log
      - name: Dedicated Minecraft regression tests
        run: ./gradlew --no-daemon -PwithGameTests runGameTestServer 2>&1 | tee body-gametest.log
      - name: Native Minecraft electric regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          rm -f run/electric-smoke-result.txt
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientElectricSmoke 2>&1 | tee body-native.log
          grep -q '^PASS' run/electric-smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-authoring-verification
          path: |
            body-*.log
            body-tested-commit.txt
            assets/body_styles/
            docs/body-styles/
            build/reports/
            sim/build/reports/
            sim/build/test-results/
            run/*smoke-result.txt
            run/screenshots/
            run/logs/
            run/gametest/logs/
          retention-days: 14
