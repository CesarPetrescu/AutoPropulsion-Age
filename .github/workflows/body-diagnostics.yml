name: Body fit diagnostics
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['.github/workflows/body-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys,json,pathlib
          sys.path.insert(0,'tools/body_styles')
          from mesh_io import read,bounds
          base=pathlib.Path('src/main/resources/assets/sparkmotors/models/entity')
          cs=read(base/'sedan.mesh.gz')
          for c in cs:
              if c['category'] in (8,9,10,11,39):
                  print(json.dumps({'kind':'original-interior','name':c['name'],'category':c['category'],'group':c['group'],'variant':c['variant'],'hinge':c['hinge'],'bounds':bounds([c])}))
          for b in json.loads(pathlib.Path('assets/body_styles/profiles.json').read_text())['bodies']:
              print('BODY',b['id'])
              cs=read(base/'bodies'/(b['id']+'.mesh.gz'))
              for c in cs:
                  lo,hi=bounds([c])
                  if hi[1]>b['roof']+.04 or lo[0]<-b['halfWidth']-.16 or hi[0]>b['halfWidth']+.16:
                      print(json.dumps({'name':c['name'],'category':c['category'],'variant':c['variant'],'bounds':[lo,hi]}))
          PY
