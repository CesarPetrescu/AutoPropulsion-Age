name: Body refinement and complete verification
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['.github/workflows/body-refine.yml']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: body-refinement
  cancel-in-progress: false
jobs:
  refine:
    if: github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref == 'refs/heads/feat/five-body-styles'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/five-body-styles
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply reviewed visual-clearance and verification lifecycle corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def edit(path,old,new):
              p=Path(path);s=p.read_text()
              if new in s and old not in s:return
              assert s.count(old)==1,(path,old,s.count(old))
              p.write_text(s.replace(old,new))
          model='tools/body_styles/build_models.py'
          edit(model,"floor=.43+s['cabinY']","floor=max(.43,.43+s['cabinY'])")
          edit(model,"c=dict(original);verts=[]","c=dict(original);verts=[]\n        local_dy=max(0,dy) if name.startswith(('front_seat_','floor_mat_')) or name.endswith('_pedal') else dy")
          edit(model,"if cabin:y+=dy;z+=dz","if cabin:y+=local_dy;z+=dz")
          edit(model,"if cabin:c['py']+=dy;c['pz']+=dz","if cabin:c['py']+=local_dy;c['pz']+=dz")
          edit(model,'hood_front=nose-.085','hood_front=nose-.032')
          style='sim/src/main/java/com/photonspark/sparkmotors/sim/BodyStyle.java'
          edit(style,'public double seatY(){return .18+cabinY;}','public double seatY(){return .18+Math.max(0,cabinY);}')
          smoke='src/gametest/java/com/photonspark/sparkmotors/gametest/BodyStyleClientSmoke.java'
          edit(smoke,'private static boolean creating,spawnPending,prepared,done;','private static boolean creating,prepared,done;\n    private static volatile boolean spawnPending;')
          edit(smoke,'require(mc.screen!=null&&!(mc.screen instanceof TitleScreen),"Garage preview not opened through native packet");','require(mc.screen instanceof GarageScreen,"Garage preview not opened through native packet");')
          pipeline='tools/ci/resources.py'
          edit(pipeline,"('generate_resources.py','generate_electric_resources.py')","('generate_resources.py','generate_electric_resources.py','body_styles/generate_resources.py')")
          p=Path('.github/workflows/body-verify.yml');s=p.read_text()
          s=re.sub(r'  pull_request:\n    paths:.*\n','',s)
          s=s.replace('cancel-in-progress: true','cancel-in-progress: false')
          p.write_text(s)
          p=Path('.github/workflows/body-delivery.yml');s=p.read_text()
          s=re.sub(r'on:\n.*?permissions:', 'on:\n  workflow_dispatch:\npermissions:',s,count=1,flags=re.S)
          p.write_text(s)
          print('Visual fitting and test lifecycle updated; no engine/battery/tire specification modified')
          PY
          python3 -m pip install Pillow==11.3.0
          python3 tools/body_styles/generate_resources.py
      - name: Install verified Blender and native graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libopenal1 libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6
          curl --fail --location --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          curl --fail --location --retry 3 -o /tmp/blender.sha256 https://download.blender.org/release/Blender4.2/blender-4.2.3.sha256
          expected=$(grep 'blender-4.2.3-linux-x64.tar.xz' /tmp/blender.sha256 | awk '{print $1}')
          test ${#expected} -eq 64
          echo "$expected  /tmp/blender.tar.xz" | sha256sum --check
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Rebuild all five authored bodies and reference renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          /tmp/blender-4.2.3-linux-x64/blender --background --threads 4 --python-exit-code 1 --python tools/body_styles/build_models.py 2>&1 | tee body-authoring.log
          test -f assets/body_styles/profiles.json
          find assets/body_styles -name '*.blend1' -delete
          rm -f docs/body-styles/blender-review.pdf
      - name: Preserve the exact refined feature source
        run: |
          git add src sim assets/body_styles docs/body-styles tools .github/workflows/body-verify.yml .github/workflows/body-delivery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: clear coupe battery packaging and synchronize body verification lifecycle'
            git pull --rebase origin feat/five-body-styles
            git push origin HEAD:feat/five-body-styles
          fi
          git rev-parse HEAD > body-tested-commit.txt
      - name: Build and simulation tests
        id: compile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwithGameTests build :sim:test 2>&1 | tee body-build.log
      - name: Body envelopes and shared mechanical fit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 tools/body_review/validate.py --report 2>&1 | tee body-geometry.log
      - name: Editable Blender roundtrip for all five bodies
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          for body in hatchback sports_car suv van touring_sedan; do
            /tmp/blender-4.2.3-linux-x64/blender --background assets/body_styles/$body.blend --threads 2 --python-exit-code 1 --python tools/body_review/export_blend.py -- --output /tmp/$body.mesh.gz --check 2>&1 | tee body-roundtrip-$body.log
          done
      - name: Dedicated Minecraft server body and existing regression tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          ./gradlew --no-daemon -PwithGameTests runGameTestServer 2>&1 | tee body-gametest.log
          grep -q 'BODY_CRATE_CONVERSION_SERVER_PASS 150' body-gametest.log
          grep -q 'BODY_DRIVING_SERVER_MATRIX_PASS 30' body-gametest.log
      - name: Native Minecraft 25-body-powertrain capture matrix
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          rm -f run/body-smoke-result.txt run/body-smoke-result.json
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientBodySmoke 2>&1 | tee body-client.log
          cat run/body-smoke-result.txt
          grep -q '^PASS' run/body-smoke-result.txt
          python3 - <<'PY'
          import json,pathlib,struct
          root=pathlib.Path('run');data=json.loads((root/'body-smoke-result.json').read_text())
          assert len(data['cases'])==25 and len(set(data['cases']))==25
          assert len(data['screenshots'])==125 and len(set(data['screenshots']))==125
          for name in data['screenshots']:
              p=root/'screenshots'/name;b=p.read_bytes()
              assert len(b)>1000 and b[:8]==b'\x89PNG\r\n\x1a\n',name
              assert struct.unpack('>II',b[16:24])==(1440,900),name
          print('BODY_SCREENSHOT_FILES_PASS 125; visual approval requires inspecting image contents')
          PY
      - name: Summarize exact evidence without hiding failed checks
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as E
          root=pathlib.Path('.')
          totals={key:0 for key in ('tests','failures','errors','skipped')}
          for p in root.glob('sim/build/test-results/test/TEST-*.xml'):
              tree=E.parse(p).getroot()
              for key in totals:totals[key]+=int(tree.attrib.get(key,0))
          result={'source':(root/'body-tested-commit.txt').read_text().strip() if (root/'body-tested-commit.txt').exists() else None,'unitTests':totals,'native':json.loads((root/'run/body-smoke-result.json').read_text()) if (root/'run/body-smoke-result.json').exists() else None,'geometry':json.loads((root/'build/reports/body-styles/geometry.json').read_text()) if (root/'build/reports/body-styles/geometry.json').exists() else None,'visualApproval':False}
          (root/'body-evidence-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-body-verification
          path: |
            body-*.log
            body-tested-commit.txt
            body-evidence-summary.json
            assets/body_styles/
            docs/body-styles/
            build/reports/body-styles/
            sim/build/reports/
            sim/build/test-results/
            run/body-smoke-result.*
            run/screenshots/body-*.png
            run/logs/
            run/gametest/logs/
            run/crash-reports/
          retention-days: 14
