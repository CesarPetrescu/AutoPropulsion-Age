name: Body feature review source
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['.github/workflows/body-review-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source including editable body assets
        run: |
          git rev-parse HEAD > review-source-commit.txt
          git archive --format=tar HEAD | gzip -1 > body-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: body-review-source
          path: |
            body-review-source.tar.gz
            review-source-commit.txt
          retention-days: 7
