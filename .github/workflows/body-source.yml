name: Body style development source
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['.github/workflows/body-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot source and authored assets
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=tar HEAD | gzip -1 > body-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: body-source
          path: |
            body-source.tar.gz
            source-commit.txt
          retention-days: 7
      - name: Obtain pinned portable Blender from the official release archive
        run: |
          curl --fail --location --retry 3 --output blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          curl --fail --location --retry 3 --output blender-checksums.txt https://download.blender.org/release/Blender4.2/blender-4.2.3.sha256
          expected=$(grep 'blender-4.2.3-linux-x64.tar.xz' blender-checksums.txt | awk '{print $1}')
          test ${#expected} -eq 64
          echo "$expected  blender.tar.xz" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: blender-portable-4.2.3
          path: |
            blender.tar.xz
            blender-checksums.txt
          compression-level: 0
          retention-days: 2
