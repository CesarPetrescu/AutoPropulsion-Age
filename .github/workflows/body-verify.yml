name: Body style runtime verification
on:
  push:
    branches: [feat/five-body-styles]
    paths: ['src/**', 'sim/**', 'build.gradle', 'gradle.properties', '.github/workflows/body-verify.yml']
  pull_request:
    paths: ['src/**', 'sim/**', 'build.gradle', 'gradle.properties', '.github/workflows/body-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: body-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Record body source and potentially protruding geometry
        run: |
          git rev-parse HEAD > body-tested-commit.txt
          python3 - <<'PY' | tee body-geometry.log
          import sys,json,pathlib
          sys.path.insert(0,'tools/body_styles')
          from mesh_io import read,bounds
          p=pathlib.Path('assets/body_styles/profiles.json')
          assert p.is_file(),'Body assets not generated'
          for b in json.loads(p.read_text())['bodies']:
              cs=read(pathlib.Path('src/main/resources/assets/sparkmotors/models/entity/bodies')/(b['id']+'.mesh.gz'))
              print('\nBODY',b['id'],'triangles',sum(len(c['vertices'])//3 for c in cs))
              for c in cs:
                  lo,hi=bounds([c])
                  if hi[1]>b['roof']+.04 or lo[0]<-b['halfWidth']-.17 or hi[0]>b['halfWidth']+.17:
                      print(json.dumps({'name':c['name'],'category':c['category'],'variant':c['variant'],'hinge':c['hinge'],'bounds':[lo,hi]}))
          PY
      - name: Compile all test sources and run simulation regressions
        id: compile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwithGameTests build :sim:test 2>&1 | tee body-build.log
      - name: Native dedicated-server body and existing regression tests
        id: server
        run: |
          ./gradlew --no-daemon -PwithGameTests runGameTestServer 2>&1 | tee body-gametest.log
          grep -q 'BODY_CRATE_CONVERSION_SERVER_PASS 150' body-gametest.log
          grep -q 'BODY_DRIVING_SERVER_MATRIX_PASS 30' body-gametest.log
      - name: Install native software graphics
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libopenal1
      - name: Native client with 25 body and powertrain combinations
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          rm -f run/body-smoke-result.txt run/body-smoke-result.json
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientBodySmoke 2>&1 | tee body-client.log
          cat run/body-smoke-result.txt
          grep -q '^PASS' run/body-smoke-result.txt
          python3 - <<'PY'
          import json,pathlib,struct
          root=pathlib.Path('run');data=json.loads((root/'body-smoke-result.json').read_text())
          assert len(data['cases'])==25 and len(set(data['cases']))==25
          assert len(data['screenshots'])==125 and len(set(data['screenshots']))==125
          for name in data['screenshots']:
              p=root/'screenshots'/name
              b=p.read_bytes();assert len(b)>1000 and b[:8]==b'\x89PNG\r\n\x1a\n',name
              assert struct.unpack('>II',b[16:24])==(1440,900),name
          print('BODY_SCREENSHOT_FILES_PASS 125; requires separate visual review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-runtime-verification
          path: |
            body-*.log
            body-tested-commit.txt
            sim/build/test-results/
            sim/build/reports/
            run/body-smoke-result.*
            run/screenshots/body-*.png
            run/logs/
            run/gametest/logs/
            run/crash-reports/
          retention-days: 14
