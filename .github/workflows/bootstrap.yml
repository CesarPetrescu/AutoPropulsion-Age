name: Regenerate Blender assets
on:
  workflow_dispatch:
  push:
    paths: ['assets/blender/**', 'assets/catalog.json', 'scripts/generate-content.py']
  pull_request:
    paths: ['assets/blender/**', 'assets/catalog.json', 'scripts/generate-content.py']
permissions:
  contents: read
concurrency:
  group: assets-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install authoring tools
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy ffmpeg
      - name: Regenerate and validate
        run: |
          mkdir -p build/reports
          python3 scripts/generate-content.py
          set -o pipefail
          blender -b --python-exit-code 1 --python assets/blender/build_assets.py 2>&1 | tee build/reports/blender.log
          ffmpeg -y -i assets/source/engine-loop.wav -c:a libvorbis -q:a 4 mod/src/main/resources/assets/autopropulsion/sounds/engine_loop.ogg
          python3 scripts/validate-content.py --assets
      - name: Check committed runtime geometry matches the generator
        run: git diff --exit-code -- mod/src/main/resources/assets/autopropulsion/models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopropulsion-assets-${{ github.run_number }}
          path: |
            assets/source/**
            assets/manifest.json
            docs/images/**
            build/reports/**
          retention-days: 14
