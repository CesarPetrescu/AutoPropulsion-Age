name: Test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  LIBGL_ALWAYS_SOFTWARE: 'true'
  LP_NUM_THREADS: '2'
  ALSOFT_DRIVERS: 'null'

jobs:
  workflow:
    name: Workflow and release gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate GitHub Actions syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Exercise missing, failed and tampered release evidence
        run: |
          mkdir -p build/ci
          python -m unittest discover -s tools/ci/tests -v 2>&1 | tee build/ci/release-gates.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-workflow
          path: build/ci/
          retention-days: 14

  build:
    name: Build, simulation and dedicated server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-test-runtime
      - name: Build and execute JUnit and native GameTests
        run: |
          mkdir -p build/ci
          ./gradlew --no-daemon --max-workers=2 -PwithGameTests build :sim:test --rerun runGameTestServer :sim:mechanicsBenchmark 2>&1 | tee build/ci/server.log
          python tools/ci/checks.py junit --report build/ci/junit.json
          python tools/ci/checks.py server --log build/ci/server.log --report build/ci/server.json
      - name: Run independent boundary and energy audit
        run: |
          mkdir -p build/qa/classes
          find sim/src/main/java -name '*.java' > build/qa/sources.txt
          javac -d build/qa/classes @build/qa/sources.txt tools/qa/IndependentAudit.java
          java -cp build/qa/classes IndependentAudit 2>&1 | tee build/ci/independent-audit.log
      - name: Inspect and checksum the installable JAR from this run
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/ci/checks.py package --jar build/libs/autopropulsion-age-*.jar --directory build/release --run-url "$RUN_URL"
          python tools/ci/checks.py verify-package --directory build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-build-server
          path: |
            build/ci/
            sim/build/test-results/
            sim/build/reports/
            run/gametest/logs/
            run/gametest/crash-reports/
          retention-days: 14

  resources:
    name: Resources, audio and geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APA_VALIDATION_OUTPUT: build/ci/resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install asset validation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg blender
          python -m pip install -r tools/ci/requirements.txt
      - name: Validate README previews, links and mod logo
        run: python tools/ci/documentation.py
      - name: Regenerate resources and decode every mechanical sound
        run: python tools/ci/resources.py
      - name: Validate all hardware geometry, envelopes and hood intersections
        run: |
          python tools/verify_powertrain_mesh.py
          python tools/verify_engine_fit.py
          blender --background --factory-startup --python-exit-code 1 --python tools/validate_engine_geometry.py
          blender --background --factory-startup --python-exit-code 1 --python tools/validate_body_geometry.py
          blender --background --factory-startup --python-exit-code 1 --python tools/validate_drivetrain_geometry.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-resources
          path: build/ci/resources/
          retention-days: 14

  client:
    name: Native client (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: mechanics
            task: runClientMechanics
          - mode: matrix
            task: runClientSmoke
          - mode: ui
            task: runClientUi
          - mode: electric
            task: runClientElectricSmoke
          - mode: handling
            task: runClientHandling
          - mode: graphics
            task: runClientGraphics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-test-runtime
        with:
          native: 'true'
      - name: Run Minecraft under software graphics and OpenAL null output
        env:
          TEST_TASK: ${{ matrix.task }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' ./gradlew --no-daemon --max-workers=2 -PwithGameTests "$TEST_TASK" 2>&1 | tee build/ci/client.log
          python tools/ci/checks.py "$TEST_MODE" --log build/ci/client.log --report build/ci/client.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-client-${{ matrix.mode }}
          path: |
            build/ci/
            run/alpha-smoke-result.txt
            run/electric-smoke-result.txt
            run/logs/
            run/screenshots/
            run/crash-reports/
          retention-days: 14

  multiplayer:
    name: Two native clients and dedicated server
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-test-runtime
        with:
          native: 'true'
      - name: Prepare native launch descriptors
        run: ./gradlew --no-daemon --max-workers=2 -PwithGameTests prepareMultiplayerHarness
      - name: Test ownership, native trading and preserved used state
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python tools/run_multiplayer_test.py --timeout 720
          python tools/ci/checks.py multiplayer --directory build/ci/multiplayer --report build/ci/multiplayer.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-multiplayer
          path: |
            build/ci/
            run/multi-*/logs/
            run/multi-*/crash-reports/
          retention-days: 14

  companion:
    name: ElectricalAge compatibility
    uses: ./.github/workflows/eln-compat.yml

  required:
    name: Required checks
    if: always()
    needs: [workflow, build, resources, client, multiplayer, companion]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          bad = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if bad:
              raise SystemExit('Release blocked: ' + json.dumps(bad))
          print('Every required test job passed.')
          PY

  release:
    name: Publish tested alpha JAR
    needs: [required, build]
    if: github.event_name == 'push' && github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref_name == (vars.RELEASE_BRANCH || 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-latest-alpha
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: evidence
      - name: Verify provenance and package evidence
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('release')
          info = json.loads((folder / 'build-info.json').read_text())
          assert info['commit'] == os.environ['GITHUB_SHA'], 'Wrong commit artifact'
          expected_names = set(info['jars']) | {'build-info.json'}
          sums = {}
          for line in (folder / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert Path(name).name == name and name not in sums
              assert hashlib.sha256((folder / name).read_bytes()).hexdigest() == digest, name
              sums[name] = digest
          assert set(sums) == expected_names
          assert set(p.name for p in folder.iterdir()) == expected_names | {'SHA256SUMS.txt'}
          assert len(info['jars']) == 2 and len(set(info['jars'].values())) == 1
          assert all(sums[name] == digest for name, digest in info['jars'].items())
          assert 'autopropulsion-age-latest.jar' in info['jars']
          PY
          zip -qr release/test-evidence.zip evidence
          sha256sum release/test-evidence.zip | sed 's@release/@@' >> release/SHA256SUMS.txt
      - name: Publish an immutable build release after all checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/$RELEASE_BRANCH" --jq .sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit exists; this run will keep its artifacts without replacing Latest.'
            exit 0
          fi
          version=$(jq -r .version release/build-info.json)
          tag="ci-${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('release/build-info.json').read_text())
          text = f"""Tested alpha for **Minecraft {info['minecraft']} / NeoForge {info['neoforge']} / Java {info['java']}**.

          Install **autopropulsion-age-latest.jar** (or the identical versioned JAR) in your instance's `mods` folder. Replace older copies; install only one of the two JARs.

          All required jobs passed: simulation/JUnit, 294 dedicated engine/drivetrain driving cases, native RWD/FWD/AWD drift and suspension checks, eight heading resets and partial-packet interpolation regressions, Fabulous startup and native graphics-menu transitions, 192 workshop page/scale cases with scaled input and the mod logo, electric/hybrid charging and driving, ElectricalAge native integration, full 49-layout and 42-hardware native client matrix, coolant repair/instruments/audio-channel workflow, two-client ownership/trading, audio regeneration, and geometry fit/intersections.

          Commit: {info['commit']}
          [CI run and individual test results]({info['run_url']})

          SHA256SUMS.txt verifies the JARs, build provenance and attached test-evidence.zip. The archive includes fresh logs, reports and native screenshots from this run.

          This remains an alpha. Software-rendered client/channel tests do not replace subjective listening, testing other modpacks, remote latency or GPU performance testing. GitHub's Latest label points to the newest fully tested alpha build.
          """
          Path('release-notes.md').write_text('\n'.join(line.strip() for line in text.splitlines()) + '\n')
          PY
          gh release create "$tag" --target "$GITHUB_SHA" --title "AutoPropulsion Age $version · tested build $GITHUB_RUN_NUMBER" --notes-file release-notes.md --draft release/*
          gh release edit "$tag" --draft=false --latest
          {
            echo '### Tested alpha published'
            echo "[Release](https://github.com/$GH_REPO/releases/tag/$tag)"
            echo "[Latest JAR](https://github.com/$GH_REPO/releases/latest/download/autopropulsion-age-latest.jar)"
          } >> "$GITHUB_STEP_SUMMARY"
