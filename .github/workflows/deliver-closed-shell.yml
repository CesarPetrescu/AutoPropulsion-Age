name: Commit verified repaired body source and assets
on:
  push:
    branches: [fix/closed-body-models]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: deliver-closed-body-models
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref == 'refs/heads/fix/closed-body-models'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/closed-body-models
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: closed-shell-delivery-evidence
          run-id: 34351040306
          github-token: ${{ github.token }}
          path: /tmp/closed-shell-recovery
      - name: Recover the exact generated models that passed Blender and topology validation
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,tarfile
          matches=list(pathlib.Path('/tmp/closed-shell-recovery').rglob('repaired-files.tar.gz'))
          assert len(matches)==1,matches
          archive=matches[0]
          with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='c7edb9841c1ca5757ee1bdc092925c529479600b409becda8e23d042610d7bf1'
          root=pathlib.Path.cwd()
          with tarfile.open(archive,'r:gz') as tar:
              for member in tar.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts,member.name
                  assert member.isdir() or member.isfile(),member.name
                  if member.isdir():continue
                  name=str(path)
                  assert name.startswith(('src/','sim/','tools/','assets/body_styles/','docs/')) or name in ('build.gradle','gradle.properties','.github/workflows/ci.yml'),name
                  dest=root/name;dest.parent.mkdir(parents=True,exist_ok=True)
                  data=tar.extractfile(member).read();dest.write_bytes(data)
                  if member.mode&0o111:dest.chmod(0o755)
          print('RECOVERED_EXACT_VALIDATED_ASSETS',archive)
          PY
      - name: Stage actual source and each regenerated binary explicitly
        run: |
          git rm .ci/closed-shell-0.txt .ci/closed-shell-1.txt .ci/closed-shell-2.txt .github/workflows/deliver-closed-shell.yml
          git add src sim tools docs/BODY_STYLES.md docs/BODY_SHELL_REPAIR.md assets/body_styles build.gradle gradle.properties .github/workflows/ci.yml
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib
          required=[]
          for body in ('hatchback','sports_car','suv','van','touring_sedan'):
              required += [f'assets/body_styles/{body}.blend',f'src/main/resources/assets/sparkmotors/models/entity/bodies/{body}.mesh.gz']
          manifest=[]
          for name in required:
              path=pathlib.Path(name);assert path.is_file(),name
              subprocess.run(['git','update-index','--no-assume-unchanged','--no-skip-worktree','--',name],check=True)
              subprocess.run(['git','add','-f','--',name],check=True)
              before=subprocess.check_output(['git','rev-parse','cf74a3d8b599929e090ebd1076c229b9f2c12b67:'+name],text=True).strip()
              after=subprocess.check_output(['git','rev-parse',':'+name],text=True).strip()
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              print(name,'base='+before,'index='+after,'actual='+actual,flush=True)
              assert actual==after and before!=after,'Repaired binary absent or unchanged: '+name
              manifest.append({'path':name,'baseBlob':before,'newBlob':after,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size})
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only','--no-renames'],text=True).splitlines())
          print('STAGED_FILES',json.dumps(sorted(changed)),flush=True)
          for name in required+['tools/body_styles/shell_geometry.py','tools/body_review/topology.py','src/main/java/com/photonspark/sparkmotors/client/CarMesh.java']:
              assert name in changed,name
          out=pathlib.Path('build/ci/delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'delivered-assets.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git diff --cached --stat
      - name: Commit actual repaired files to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deliver closed body shells, shaped rear quarters, five editable models and seam tests'
          git push origin HEAD:fix/closed-body-models
          git rev-parse HEAD > build/ci/delivery/source-commit.txt
          git diff --stat cf74a3d8b599929e090ebd1076c229b9f2c12b67 HEAD > build/ci/delivery/delivered-files.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: committed-closed-shell-evidence
          path: build/ci/delivery/
          retention-days: 14
