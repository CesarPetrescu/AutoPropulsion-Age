name: Refresh repaired Blender body previews
on:
  push:
    branches: [docs/refresh-091-body-gallery]
    paths: ['.github/workflows/docs-blender-refresh.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refresh-091-body-gallery
      - name: Install pinned Blender 4.2.3
        run: |
          curl --fail --location --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          curl --fail --location --retry 3 -o /tmp/blender.sha256 https://download.blender.org/release/Blender4.2/blender-4.2.3.sha256
          expected=$(grep 'blender-4.2.3-linux-x64.tar.xz' /tmp/blender.sha256 | awk '{print $1}')
          test ${#expected} -eq 64
          echo "$expected  /tmp/blender.tar.xz" | sha256sum --check
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Render current repaired body sources
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          /tmp/blender-4.2.3-linux-x64/blender --background --threads 4 --python-exit-code 1 --python tools/body_styles/build_models.py 2>&1 | tee /tmp/blender-review.log
          for body in hatchback sports_car suv van touring_sedan; do
            for view in front rear side; do
              test -s "docs/body-styles/blender/${body}-${view}.png"
            done
          done
      - name: Restore required visible Blender previews in README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md');s=p.read_text()
          marker='### Current Minecraft body gallery — 0.9.1 repaired shells\n'
          assert marker in s
          if '### Blender source previews — current repaired meshes' not in s:
              block='''### Blender source previews — current repaired meshes

These are regenerated from the current repaired `.blend` sources using Blender 4.2.3. The native Minecraft captures below are still the runtime proof; these renders are the editable-source reference views.

| Hatchback | Sports Coupe | Utility SUV | Panel Van | Touring Sedan |
|---|---|---|---|---|
| ![Hatchback Blender preview](docs/body-styles/blender/hatchback-front.png) | ![Sports Coupe Blender preview](docs/body-styles/blender/sports_car-front.png) | ![Utility SUV Blender preview](docs/body-styles/blender/suv-front.png) | ![Panel Van Blender preview](docs/body-styles/blender/van-front.png) | ![Touring Sedan Blender preview](docs/body-styles/blender/touring_sedan-front.png) |

'''
              s=s.replace(marker,block+marker)
              p.write_text(s)
          PY
      - name: Keep documentation renders only
        run: |
          git checkout HEAD -- assets/body_styles src/main/resources/assets/sparkmotors/models/entity/bodies
          git rm .github/workflows/docs-blender-refresh.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/body-styles/blender
          git commit -m 'docs: refresh repaired Blender body previews'
          git push origin HEAD:docs/refresh-091-body-gallery
