name: Stage repaired-shell documentation gallery
on:
  push:
    branches: [docs/refresh-091-body-gallery]
    paths: ['.github/workflows/docs-gallery-refresh.yml']
permissions:
  actions: read
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refresh-091-body-gallery
      - name: Download successful PR 7 shell evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10104832682/zip > /tmp/shell.zip
          mkdir -p /tmp/shell
          unzip -q /tmp/shell.zip -d /tmp/shell
          grep -q '^PASS ' /tmp/shell/run/shell-smoke-result.txt
      - name: Copy fresh front and rear native captures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, struct
          source = Path('/tmp/shell/run/screenshots')
          target = Path('docs/body-styles/native')
          bodies = ['hatchback', 'sports_car', 'suv', 'van', 'touring_sedan']
          for body in bodies:
              for view, capture in {
                  'front': f'seams-{body}-combustion-closed-front-left.png',
                  'rear': f'seams-{body}-combustion-closed-rear-left.png',
              }.items():
                  src = source / capture
                  dst = target / f'{body}-{view}.png'
                  data = src.read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', data[16:24]) == (1440, 900)
                  shutil.copyfile(src, dst)
                  print(dst, len(data))
          PY
      - name: Commit only fresh gallery images
        run: |
          git rm .github/workflows/docs-gallery-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/body-styles/native
          test $(git diff --cached --name-only 'docs/body-styles/native/*-front.png' 'docs/body-styles/native/*-rear.png' | wc -l) -eq 10
          git commit -m 'docs: refresh repaired body screenshots from native CI evidence'
          git push origin HEAD:docs/refresh-091-body-gallery
