name: Electrified powertrain verification
on:
  push:
    branches: [feat/electrified-powertrains]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electrified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Archive inspection workspace
        run: |
          tar -czf inspection-workspace.tar.gz src sim tools build.gradle settings.gradle gradle.properties gradle gradlew docs/DEVELOPMENT.md docs/PLAYING.md docs/screenshots/alpha-garage.png docs/screenshots/hood-i4-natural.png
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-workspace
          path: inspection-workspace.tar.gz
          retention-days: 3
      - name: Build and simulation tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build :sim:test
      - name: Dedicated Minecraft GameTests
        run: ./gradlew --no-daemon -PwithGameTests runGameTestServer
      - name: Install native client dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 pulseaudio
      - name: Native Minecraft client smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientSmokeQuick
          cat run/alpha-smoke-result.txt
          grep -q PASS run/alpha-smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrified-verification
          path: |
            build/libs/*.jar
            build/reports/
            sim/build/reports/
            run/alpha-smoke-result.txt
            run/screenshots/
            run/logs/
            run/gametest/logs/
          retention-days: 14
