name: Electrified powertrain verification
on:
  push:
    branches: [main]
    paths-ignore: ['.ci/**', 'docs/**', 'README.md']
  pull_request:
    paths-ignore: ['.ci/**', 'docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: electrified-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Record tested source
        run: git rev-parse HEAD > tested-commit.txt
      - name: Check official Minecraft dependency metadata
        run: bash tools/ci_minecraft_metadata.sh 2>&1 | tee metadata.log
      - name: Build and simulation tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwithGameTests build :sim:test 2>&1 | tee compile.log
      - name: Dedicated Minecraft GameTests
        run: ./gradlew --no-daemon -PwithGameTests runGameTestServer 2>&1 | tee gametest.log
      - name: Install native client dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 pulseaudio
      - name: Native electric vehicle client smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          rm -f run/electric-smoke-result.txt
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientElectricSmoke 2>&1 | tee electric-client.log
          cat run/electric-smoke-result.txt
          grep -q '^PASS' run/electric-smoke-result.txt
      - name: Native combustion regression smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          rm -f run/alpha-smoke-result.txt
          xvfb-run -a -s '-screen 0 1440x900x24' ./gradlew --no-daemon -PwithGameTests runClientSmokeQuick 2>&1 | tee combustion-client.log
          cat run/alpha-smoke-result.txt
          grep -q '^PASS' run/alpha-smoke-result.txt
      - name: Inspect release isolation
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          jars=list(pathlib.Path('build/libs').glob('*.jar'))
          assert jars
          for path in jars:
              names=zipfile.ZipFile(path).namelist()
              assert not any('/gametest/' in n or '/structure/test_track.nbt' in n for n in names),path
              assert 'com/photonspark/sparkmotors/sim/electric/BatteryModel.class' in names,path
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electrified-verification
          path: |
            tested-commit.txt
            *.log
            build/libs/*.jar
            build/reports/
            sim/build/reports/
            sim/build/test-results/
            run/*smoke-result.txt
            run/screenshots/
            run/logs/
            run/gametest/logs/
          retention-days: 14
