name: Electrification source delivery
on:
  push:
    branches: [feat/electrified-powertrains]
    paths: ['.ci/electric-b.b64']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: electrification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref == 'refs/heads/feat/electrified-powertrains'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/electrified-powertrains
      - name: Apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          p=pathlib.Path
          encoded=''.join(f.read_text().strip() for f in sorted(p('.ci').glob('electric-*.b64')))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='dfc7bacc42042df4de2b97f0833476272323aff9ddbbe7b21bca486fcb2b0045'
          p('/tmp/electric.patch').write_bytes(data)
          for line in subprocess.check_output(['git','apply','--numstat','/tmp/electric.patch'],text=True).splitlines():
              name=line.split('\t')[-1]
              assert name.startswith(('src/','sim/','tools/','docs/')) or name in ('build.gradle','gradle.properties'),name
          subprocess.run(['git','apply','--check','/tmp/electric.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/electric.patch'],check=True)
          PY
          git rm .ci/electric-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: rated circuit fixture, native diagnostics and charger visual review'
          git push origin HEAD:feat/electrified-powertrains
