name: Vehicle validation
on:
  push:
    branches: [main, feat/component-damage-and-vehicle-audio]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vehicle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALSOFT_DRIVERS: 'null'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install audio and headless client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb libgl1-mesa-dri libopenal1
      - name: Record exact verified source
        run: git rev-parse HEAD > verified-commit.txt
      - name: Preserve exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-source
          path: |
            src/
            sim/
            tools/
            gradle/
            gradlew
            gradlew.bat
            build.gradle
            settings.gradle
            gradle.properties
            docs/COMPONENT-DAMAGE-AUDIO.md
            README.md
            verified-commit.txt
          retention-days: 7
      - name: Validate generated audio and standalone model
        run: |
          python3 tools/validate_vehicle_audio.py > vehicle-audio-validation.json
          mkdir -p /tmp/vehicle-model-test
          javac -d /tmp/vehicle-model-test $(find sim/src/main/java -name '*.java') tools/VehicleSystemSelfTest.java
          java -cp /tmp/vehicle-model-test VehicleSystemSelfTest | tee vehicle-model-validation.txt
      - name: Build and unit tests
        id: build
        run: chmod +x gradlew && ./gradlew --no-daemon build -PwithGameTests
      - name: Dedicated server GameTests
        run: ./gradlew --no-daemon runGameTestServer -PwithGameTests
      - name: Native client integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run -a ./gradlew --no-daemon runClientSmoke -PwithGameTests
          python3 - <<'PY'
          from pathlib import Path
          results = list(Path('run').rglob('alpha-smoke-result.txt'))
          assert results, 'Client did not produce a verification result'
          for result in results:
              text = result.read_text()
              print(result, text)
              assert text.startswith('PASS:'), text
          PY
      - name: Preserve build and verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-validation
          path: |
            build/libs/*.jar
            sim/build/reports/tests/
            sim/build/test-results/
            build/reports/
            run/**/logs/
            run/**/alpha-smoke-result.txt
            verified-commit.txt
            vehicle-audio-validation.json
            vehicle-model-validation.txt
          if-no-files-found: warn
      - name: Preserve native client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-client-screenshots
          path: run/**/screenshots/*.png
          if-no-files-found: warn
