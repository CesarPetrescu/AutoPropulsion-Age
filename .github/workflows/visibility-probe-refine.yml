name: Apply reviewed visibility test refinements
on:
  push:
    branches: [fix/glass-and-charger-visibility]
    paths: [.github/workflows/visibility-probe-refine.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  apply:
    if: github.repository == 'CesarPetrescu/AutoPropulsion-Age' && github.ref == 'refs/heads/fix/glass-and-charger-visibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/glass-and-charger-visibility
      - name: Apply reviewed source-only test patch
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,lzma,base64,subprocess
          encoded=''
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='098422449033eb78ad92dc1ad27a31289b511c616e95b9902cd2494a7da774f2'
          pathlib.Path('/tmp/refine.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/refine.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/refine.patch'],check=True)
          PY
          python3 -m unittest discover -s tools/ci/tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: enforce accepted witness transforms, paired glass controls and visible charger terrain'
          git push origin HEAD:fix/glass-and-charger-visibility
