plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = mod_version
group = 'com.photonspark.sparkmotors'
base { archivesName = 'autopropulsion-age' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies { implementation project(':sim') }
// Include the pure simulation classes in the mod's development and release
// outputs. FML does not load an ordinary project dependency as a mod module.
sourceSets.main.output.dir([builtBy: ':sim:classes'], project(':sim').layout.buildDirectory.dir('classes/java/main'))
if (providers.gradleProperty('withGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        clientSmoke {
            client()
            programArguments.addAll '--width', '1440', '--height', '900'
            systemProperty 'sparkmotors.clientSmoke', 'true'
        }
        clientSmokeQuick {
            client()
            programArguments.addAll '--width', '1440', '--height', '900'
            systemProperty 'sparkmotors.clientSmoke', 'true'
            systemProperty 'sparkmotors.clientQuick', 'true'
        }
        clientMechanics {
            client()
            programArguments.addAll '--width', '1440', '--height', '900'
            systemProperty 'sparkmotors.clientSmoke', 'true'
            systemProperty 'sparkmotors.clientMechanics', 'true'
        }
        clientHandling {
            client()
            programArguments.addAll '--width', '1440', '--height', '900'
            systemProperty 'sparkmotors.clientSmoke', 'true'
            systemProperty 'sparkmotors.clientHandling', 'true'
        }
        multiServer { server(); gameDirectory=file('run/multi-server');programArgument '--nogui';systemProperty 'sparkmotors.multiServer','true' }
        multiClientA { client();gameDirectory=file('run/multi-client-a');programArguments.addAll '--username','MechanicA','--width','960','--height','600';systemProperty 'sparkmotors.multiClient','A' }
        multiClientB { client();gameDirectory=file('run/multi-client-b');programArguments.addAll '--username','MechanicB','--width','960','--height','600';systemProperty 'sparkmotors.multiClient','B' }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'sparkmotors'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        sparkmotors {
            sourceSet sourceSets.main
        }
    }
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') { exclude '**/gametest/**'; exclude '**/structure/test_track.nbt' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('check') { dependsOn ':sim:test' }

// Prepare native launch descriptors so the two clients and dedicated server can run concurrently
// without holding three Gradle build locks. Generated descriptors stay in the ignored build directory.
tasks.register('prepareMultiplayerHarness') {
    dependsOn 'prepareMultiServerRun','prepareMultiClientARun','prepareMultiClientBRun','classes'
    doLast {
        def result = [:]
        ['runMultiServer','runMultiClientA','runMultiClientB'].each { name ->
            def run = tasks.named(name).get()
            def prefix = name.substring(3,4).toLowerCase() + name.substring(4)
            result[name] = [jvmArguments: run.jvmArgumentProviders.collectMany { it.asArguments().toList() }, java: run.javaLauncher.get().executablePath.asFile.absolutePath, classpath: run.classpathProvider.asPath, vmArgs: layout.buildDirectory.file('moddev/'+prefix+'RunVmArgs.txt').get().asFile.absolutePath, programArgs: layout.buildDirectory.file('moddev/'+prefix+'RunProgramArgs.txt').get().asFile.absolutePath, workingDirectory: run.gameDirectory.get().asFile.absolutePath, modClasses: run.environmentProperty.get()['MOD_CLASSES']]
        }
        layout.buildDirectory.file('multiplayer-launches.json').get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
    }
}
