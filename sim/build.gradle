plugins { id 'java-library' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    outputs.file(layout.buildDirectory.file('reports/engine-states.json'))
    outputs.file(layout.buildDirectory.file('reports/engine-driving-matrix.json'))
}
tasks.register('dyno', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.photonspark.sparkmotors.sim.Dyno'
}
tasks.register('mechanicsBenchmark', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.photonspark.sparkmotors.sim.MechanicsBenchmark'
}
